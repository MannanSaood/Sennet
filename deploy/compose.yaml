# Single-replica evaluation stack, not a high-availability deployment.
services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: sennet
      POSTGRES_PASSWORD: ${SENNET_POSTGRES_PASSWORD:?Set SENNET_POSTGRES_PASSWORD}
      POSTGRES_DB: sennet
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sennet]
      interval: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes: [kafka:/tmp/kraft-combined-logs]
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list]
      interval: 10s
      retries: 20
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, 'kafka:9092', --create, --if-not-exists, --topic, sennet-events, --partitions, '12', --replication-factor, '1']
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_USER: sennet
      CLICKHOUSE_PASSWORD: ${SENNET_CLICKHOUSE_PASSWORD:?Set SENNET_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes: [clickhouse:/var/lib/clickhouse]
    healthcheck:
      test: [CMD-SHELL, wget -q -O - http://localhost:8123/ping]
      interval: 5s
      retries: 20
  backend:
    build: {context: '..', dockerfile: backend/Dockerfile}
    environment:
      SENNET_BIND: 0.0.0.0
      SENNET_DATABASE_URL: postgres://sennet:${SENNET_POSTGRES_PASSWORD}@postgres:5432/sennet?sslmode=disable
      SENNET_CLICKHOUSE_URL: http://clickhouse:8123
      SENNET_CLICKHOUSE_USER: sennet
      SENNET_CLICKHOUSE_PASSWORD: ${SENNET_CLICKHOUSE_PASSWORD}
      SENNET_KAFKA_BROKERS: kafka:9092
      INIT_API_KEY: ${INIT_API_KEY:?Set a random bootstrap key starting sk_}
      SENNET_ALLOWED_ORIGINS: http://localhost:8088
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}
  web:
    build: {context: '..', dockerfile: web/Dockerfile}
    ports: ['127.0.0.1:8088:80']
    depends_on: [backend]
volumes:
  postgres:
  kafka:
  clickhouse:
