apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-control
spec:
  replicas: 1
  selector: {matchLabels: {app: sennet, role: query-control}}
  template:
    metadata: {labels: {app: sennet, role: query-control}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: query-control
          image: sennet/backend
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: SENNET_ENV, value: production}
            - {name: SENNET_ROLE, value: query-control}
            - {name: SENNET_BIND, value: 0.0.0.0}
            - {name: SENNET_AUTH_MODE, value: firebase}
            - {name: SENNET_KAFKA_TOPIC, value: sennet-events}
            - {name: SENNET_KAFKA_DLQ_TOPIC, value: sennet-events-dead-letter}
            - {name: SENNET_CLICKHOUSE_INIT, value: none}
            - {name: SENNET_DATABASE_URL, valueFrom: {secretKeyRef: {name: sennet-data-plane, key: postgres-url}}}
            - {name: SENNET_KAFKA_BROKERS, valueFrom: {secretKeyRef: {name: sennet-data-plane, key: kafka-brokers}}}
            - {name: SENNET_CLICKHOUSE_URL, valueFrom: {secretKeyRef: {name: sennet-data-plane, key: clickhouse-url}}}
            - {name: SENNET_CLICKHOUSE_USER, valueFrom: {secretKeyRef: {name: sennet-data-plane, key: clickhouse-user}}}
            - {name: SENNET_CLICKHOUSE_PASSWORD, valueFrom: {secretKeyRef: {name: sennet-data-plane, key: clickhouse-password}}}
            - {name: FIREBASE_SERVICE_ACCOUNT_JSON, valueFrom: {secretKeyRef: {name: sennet-data-plane, key: firebase-service-account-json}}}
            - {name: SENNET_OPERATOR_TOKEN, valueFrom: {secretKeyRef: {name: sennet-data-plane, key: operator-token}}}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /live, port: http}, periodSeconds: 10, failureThreshold: 3}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: query-control}
spec:
  selector: {app: sennet, role: query-control}
  ports: [{name: http, port: 8080, targetPort: http}]
