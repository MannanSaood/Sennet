server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 4m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 location = /api/events {
   error_page 418 = @event_ingest;
   if ($request_method = POST) { return 418; }
   proxy_pass http://query-control:8080;
   proxy_read_timeout 30s;
 }
 location @event_ingest { proxy_pass http://gateway:8080; proxy_read_timeout 30s; }
 location /api/ { proxy_pass http://query-control:8080; proxy_read_timeout 30s; }
 location /v1/ { proxy_pass http://gateway:8080; proxy_read_timeout 30s; }
 location / { try_files $uri $uri/ /index.html; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
